# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: Build and Test for the desktop application on Windows.

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  prepare:
    # ジョブは互いに独立した VM で実行されるため, 後続の各ジョブでも Qt の
    # インストールをやり直す必要がある. このジョブは Qt のキャッシュ (cache: true)
    # を温めておくことで, 後続ジョブでのインストールを高速化する目的で存在する.
    runs-on: windows-latest

    steps:
    - name: "[prepare] Checkout"
      uses: actions/checkout@v4

    - name: "[prepare] Install Qt"
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        host: windows
        target: desktop
        arch: win64_mingw
        dir: '${{ github.workspace }}/qt/'
        install-deps: true
        modules: qtmultimedia
        tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
        cache: true

  build:
    needs: prepare
    runs-on: windows-latest

    steps:
    - name: "[build] Checkout"
      uses: actions/checkout@v4

    - name: "[build] Install Qt"
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        host: windows
        target: desktop
        arch: win64_mingw
        dir: '${{ github.workspace }}/qt/'
        install-deps: true
        modules: qtmultimedia
        tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
        cache: true

    - name: "[build] Set QT_TOOLCHAIN_ROOT"
      # jurplel/install-qt-action does not export an env var pointing at the
      # MinGW toolchain it installs via `tools:`, so derive it from IQTA_TOOLS
      # (the Qt "Tools" directory it does export) and make it available to
      # cmake/toolchains/x64-windows-qt-toolchain.cmake.
      shell: bash
      run: echo "QT_TOOLCHAIN_ROOT=$IQTA_TOOLS/mingw1310_64" >> "$GITHUB_ENV"

    - name: "[build] Configure CMake"
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      shell: bash
      run:  |
        cmake --preset app-win \
         -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: "[build] Build"
      # Build your program with the given configuration
      shell: bash
      run: cmake --build build/app-win --config ${{env.BUILD_TYPE}}

    - name: "[build] Remove symlinks under _deps"
      # _deps 配下 (FetchContent で取得したサードパーティ) に循環したシンボリック
      # リンクが生成されており, actions/upload-artifact がこれを辿ろうとして
      # ELOOP で失敗する. test ジョブに _deps 配下のリンクは不要なため削除する.
      # (find -type l は lstat ベースでシンボリックリンクを辿らないため安全.)
      shell: bash
      run: find build/app-win/_deps -type l -delete

    - name: "[build] Upload build directory"
      # test ジョブは別 VM で動くため, ビルド成果物 (テストバイナリなど) を
      # artifact 経由で引き渡す.
      uses: actions/upload-artifact@v4
      with:
        name: app-win-build
        path: build/app-win
        retention-days: 1

  test:
    needs: build
    runs-on: windows-latest

    steps:
    - name: "[test] Install Qt"
      # テストバイナリが Qt6::Core / Qt6::Multimedia の DLL に実行時リンクする
      # ため, Qt のインストール (PATH への Qt bin ディレクトリ追加) が必要
      # (バイナリ本体は build ジョブの artifact から取得する).
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        host: windows
        target: desktop
        arch: win64_mingw
        dir: '${{ github.workspace }}/qt/'
        install-deps: true
        modules: qtmultimedia
        tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
        cache: true

    - name: "[test] Download build directory"
      uses: actions/download-artifact@v4
      with:
        name: app-win-build
        path: build/app-win

    - name: "[test] Test"
      shell: bash
      working-directory: build/app-win
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{env.BUILD_TYPE}}
